<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSRE CMA Pricing Strategy Tool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* (Your existing CSS remains unchanged) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; }
    /* ... rest of your styles ... */
  </style>
</head>
<body>

<header>
  <!-- Your existing header remains the same -->
  <div>
    <div class="brand">Exclusive Seller Presentation</div>
    <h1>THE STRATEGIC PRICING.</h1>
  </div>
  <div class="logo-img-wrap">
    <img src="data:image/png;base64,... (your logo base64)" alt="Mark Spain Real Estate" style="height:56px;width:auto;">
  </div>
</header>

<div class="container">

  <!-- AGENT INFO (unchanged) -->
  <div class="card">
    <h2>Agent Information</h2>
    <!-- ... existing fields ... -->
  </div>

  <!-- PROPERTY INFO (unchanged) -->
  <div class="card">
    <h2>Property Details</h2>
    <!-- ... existing fields ... -->
  </div>

  <!-- GROK AI AUTOFILL -->
  <div class="card">
    <h2>Grok AI Auto-Fill (Live Estimates)</h2>
    <p class="section-note">Enter your xAI Grok API key to fetch live AVM estimates. Get key at <a href="https://console.x.ai/" target="_blank">console.x.ai</a></p>
    <div class="api-key-row">
      <div><label>Grok API Key</label><input type="password" id="grokKey" placeholder="xai-..."></div>
      <button class="btn-save-key" onclick="saveKey()">Save Key</button>
    </div>
    <button class="btn-autofill" onclick="runGrok()">Auto-Fill AVM Estimates (Live)</button>
    <div id="status-msg">Enter address above first, then click Auto-Fill. Grok will attempt real-time estimates.</div>
  </div>

  <!-- Rest of your cards (AVM DATA, CMA TOOLS, etc.) remain unchanged -->

  <button class="btn-generate" onclick="generatePDF()">⬇ Generate Pricing Strategy PDF</button>

</div>

<script>
// ── Existing helper functions (lsSet, lsGet, onload, openSite, etc.) ──
// (Keep all your existing helper code)

let _memStore = {};
function lsSet(k, v) {
  try { localStorage.setItem(k, v); } catch(e) {
    try { sessionStorage.setItem(k, v); } catch(e2) { _memStore[k] = v; }
  }
}
function lsGet(k) {
  try { return localStorage.getItem(k); } catch(e) {
    try { return sessionStorage.getItem(k); } catch(e2) { return _memStore[k] || null; }
  }
}

window.onload = function() {
  ['agentName','agentPhone','agentEmail','agentLicense'].forEach(id => {
    const v = lsGet('msre_' + id);
    if (v) document.getElementById(id).value = v;
  });
  const k = lsGet('msre_grok_key');
  if (k) document.getElementById('grokKey').value = k;

  ['agentName','agentPhone','agentEmail','agentLicense'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => lsSet('msre_' + id, document.getElementById(id).value));
  });
};

function saveKey() {
  const k = document.getElementById('grokKey').value.trim();
  if (!k) { alert('Enter your Grok API key first.'); return; }
  lsSet('msre_grok_key', k);
  document.getElementById('status-msg').textContent = 'Grok API key saved.';
}

// ── NEW: GROK API CALL ─────────────────────────────────────────────────────
async function runGrok() {
  const key = document.getElementById('grokKey').value.trim() || lsGet('msre_grok_key');
  const addr = document.getElementById('propAddress').value.trim();

  if (!key) { alert('Enter your Grok API key first.'); return; }
  if (!addr) { alert('Enter the property address first.'); return; }

  const msg = document.getElementById('status-msg');
  msg.textContent = 'Fetching live AVM estimates via Grok...';

  const prompt = `You are a real estate valuation expert. For the property at "${addr}", provide the most current AVM estimates from major sources. Return ONLY a clean JSON object (no markdown, no extra text):

{
  "zillow_est": 000,
  "zillow_low": 000,
  "zillow_high": 000,
  "redfin_est": 000,
  "redfin_low": 000,
  "redfin_high": 000,
  "homes_est": 000,
  "homes_low": 000,
  "homes_high": 000,
  "realtor_est": 000,
  "realtor_low": 000,
  "realtor_high": 000
}

Use the latest available market data. If a source is unavailable, use 0.`;

  try {
    const res = await fetch('https://api.x.ai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: "grok-3",           // or "grok-beta" depending on your access
        messages: [{ role: "user", content: prompt }],
        temperature: 0.3,
        max_tokens: 800
      })
    });

    const data = await res.json();
    const rawText = data?.choices?.[0]?.message?.content || '';
    const clean = rawText.replace(/```json|```/g, '').trim();
    const d = JSON.parse(clean);

    const map = {
      zillow_est: 'z_est', zillow_low: 'z_low', zillow_high: 'z_high',
      redfin_est: 'r_est', redfin_low: 'r_low', redfin_high: 'r_high',
      homes_est: 'h_est', homes_low: 'h_low', homes_high: 'h_high',
      realtor_est: 'rltr_est', realtor_low: 'rltr_low', realtor_high: 'rltr_high'
    };

    Object.entries(map).forEach(([k, id]) => {
      if (d[k] && d[k] > 0) document.getElementById(id).value = d[k];
    });

    msg.textContent = '✅ Grok live estimates filled. Please verify manually.';
  } catch (e) {
    msg.textContent = '❌ Grok request failed: ' + e.message + '. Check your API key and try again.';
    console.error(e);
  }
}

// Keep your existing generatePDF(), buildReasons(), etc. unchanged
</script>
</body>
</html>
