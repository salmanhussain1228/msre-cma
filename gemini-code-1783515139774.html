<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSRE CMA Pricing Strategy Tool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Same CSS as before - kept full for reliability */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; }
    header { background: #1a1a1a; color: white; padding: 18px 32px; border-bottom: 4px solid #C8102E; display: flex; align-items: center; justify-content: space-between; }
    .container { max-width: 960px; margin: 30px auto; padding: 0 20px 60px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px 28px; margin-bottom: 24px; }
    .card h2 { font-size: 0.85rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #C8102E; margin-bottom: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #555; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea { width: 100%; border: 1.5px solid #ddd; border-radius: 5px; padding: 9px 12px; font-size: 0.92rem; }
    input:focus, textarea:focus { border-color: #C8102E; outline: none; }
    .avm-row { display: grid; grid-template-columns: 140px 110px 110px 110px; gap: 10px; align-items: end; margin-bottom: 10px; }
    .source-label { font-weight: 700; font-size: 0.88rem; padding: 9px 0; color: #333; }
    .btn-generate, .btn-autofill, .btn-save-key { background: #1a1a1a; color: white; border: none; border-radius: 5px; padding: 9px 18px; font-weight: 600; cursor: pointer; }
    .btn-generate { width: 100%; background: #C8102E; padding: 16px; font-size: 1rem; margin-top: 8px; }
    .btn-generate:hover, .btn-autofill:hover, .btn-save-key:hover { background: #C8102E; }
    #status-msg { font-size: 0.82rem; color: #888; margin-top: 8px; }
    .comp { background: #f9f9f9; padding: 10px; margin: 8px 0; border-radius: 5px; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand">Exclusive Seller Presentation</div>
    <h1>CMA PRICING STRATEGY GENERATOR</h1>
  </div>
  <img src="data:image/png;base64,/9j/..." style="height:56px;width:auto;"> <!-- Your logo -->
</header>

<div class="container">

  <!-- Agent & Property sections (same as before) -->
  <!-- ... keep your existing Agent Information and Property Details cards ... -->

  <!-- GROK LIVE DATA -->
  <div class="card">
    <h2>Grok AI — Live AVM + Comps</h2>
    <p class="section-note">Uses Grok to fetch current estimates and recent sold comps.</p>
    <div class="api-key-row">
      <input type="password" id="grokKey" placeholder="xai-...">
      <button class="btn-save-key" onclick="saveKey()">Save Key</button>
    </div>
    <button class="btn-autofill" onclick="runGrokLive()">🚀 Get Live AVM + Comps</button>
    <div id="status-msg"></div>
  </div>

  <!-- AVM Sources (same) -->
  <!-- CMA Tools (same) -->
  <!-- Pricing Tiers (same) -->
  <!-- Rationale (same) -->

  <button class="btn-generate" onclick="generatePDF()">⬇ Generate PDF</button>

  <!-- NEW: LIVE COMPS SECTION -->
  <div class="card" id="compsSection" style="display:none;">
    <h2>Recent Comparable Sales</h2>
    <div id="compsList"></div>
  </div>

</div>

<script>
// Storage, openSite, saveKey (same as before)

async function runGrokLive() {
  const key = document.getElementById('grokKey').value.trim() || lsGet('msre_grok_key');
  const addr = document.getElementById('propAddress').value.trim();
  if (!key || !addr) return alert("Missing API key or address");

  const msg = document.getElementById('status-msg');
  msg.textContent = "Fetching live data...";

  const prompt = `Property: ${addr}. Return ONLY this JSON:
{
  "zillow_est":000, "zillow_low":000, "zillow_high":000,
  "redfin_est":000, "redfin_low":000, "redfin_high":000,
  "homes_est":000, "homes_low":000, "homes_high":000,
  "realtor_est":000, "realtor_low":000, "realtor_high":000,
  "comps": [
    {"address":"123 Main St", "sold_price":650000, "sold_date":"Jun 2026", "beds":4, "baths":3, "sqft":2800},
    ...
  ]
}`;

  try {
    const res = await fetch('https://api.x.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({ model: "grok-3", messages: [{role:"user", content:prompt}], temperature:0.2 })
    });

    const data = await res.json();
    const text = data.choices[0].message.content;
    const json = JSON.parse(text.replace(/```json|```/g,'').trim());

    // Fill AVMs
    const map = {zillow_est:'z_est', ...}; // your existing map
    Object.entries(map).forEach(([k,id]) => {
      if (json[k]) document.getElementById(id).value = json[k];
    });

    // Show Comps
    showComps(json.comps || []);
    msg.textContent = "✅ Live AVM + Comps loaded!";

  } catch(e) {
    msg.textContent = "Error: " + e.message;
  }
}

function showComps(comps) {
  const container = document.getElementById('compsList');
  const section = document.getElementById('compsSection');
  container.innerHTML = '';

  if (comps.length === 0) {
    container.innerHTML = "<p>No comps found.</p>";
  } else {
    comps.forEach(c => {
      const div = document.createElement('div');
      div.className = 'comp';
      div.innerHTML = `
        <strong>${c.address}</strong> — Sold ${c.sold_date} for $${(c.sold_price/1000).toFixed(0)}K<br>
        ${c.beds}bd | ${c.baths}ba | ${c.sqft} sqft
      `;
      container.appendChild(div);
    });
  }
  section.style.display = 'block';
}

// Keep your existing generatePDF() function here...
</script>
</body>
</html>
